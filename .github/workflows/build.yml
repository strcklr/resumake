name: Build resumes

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "resumes/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/build.yml"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to publish releases on main
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        # Pango for WeasyPrint (PDF); Carlito is metric-compatible with
        # Calibri, so the PDF matches the Word document's layout.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-crosextra-carlito

      - name: Install resumake
        run: pip install -e '.[dev]'

      - name: Validate resumes
        run: resumake validate resumes

      - name: Test
        run: pytest -q

      - name: Build all formats
        run: resumake build resumes --format all --out dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: resumes-${{ github.sha }}
          path: dist/
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 90 }}

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="resume-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          {
            echo "Resumes built from ${GITHUB_SHA::7}."
            echo
            echo "| Variant | Files |"
            echo "|---|---|"
            for pdf in dist/*.pdf; do
              v=$(basename "$pdf" .pdf)
              echo "| \`$v\` | $(for e in pdf docx html md; do printf '[%s](https://github.com/%s/releases/download/%s/%s.%s) ' "$e" "$GITHUB_REPOSITORY" "$tag" "$v" "$e"; done)|"
            done
          } > notes.md
          gh release create "$tag" dist/* \
            --title "Resumes $(date -u +%Y-%m-%d) (${GITHUB_SHA::7})" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            --latest
