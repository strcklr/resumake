# CI for resumake itself: run the tests and build the sample resumes.
# Releases are published from the repos that hold real resumes (see template/).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build-resumes.yml
    permissions:
      contents: write
    with:
      install: "."
      run-tests: true
