# Type-check, test and build the web editor in web/. On main, also deploy it to GitHub Pages.
#
# Served at https://resumake.chasestrickler.com. One-time setup (see web/README.md): Pages Source set
# to "GitHub Actions", the custom domain set in Settings → Pages, and a CNAME record at the DNS host.
name: Web editor

on:
  pull_request:
    paths: ["web/**", "resumes/**", "src/resumake/**", "tests/fixtures/**", ".github/workflows/web.yml"]
  push:
    branches: [main]
    paths: ["web/**", "resumes/**", "src/resumake/**", "tests/fixtures/**", ".github/workflows/web.yml"]
  workflow_dispatch: # run by hand on main to redeploy

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # The CLI, so the tests can check the preview renders exactly what `resumake build` does.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ..
      - run: npm run check
      - run: npm test
      - run: npm run build
        env:
          # Sign-in settings (public values; see web/README.md). Unset, the editor builds without sign-in.
          VITE_GH_CLIENT_ID: ${{ vars.RESUMAKE_GH_CLIENT_ID }}
          VITE_GH_APP_SLUG: ${{ vars.RESUMAKE_GH_APP_SLUG }}
          VITE_AUTH_URL: ${{ vars.RESUMAKE_AUTH_URL }}
          # Usage counts with self-hosted Umami (see web/README.md, "What's counted"). Unset, nothing is counted.
          VITE_UMAMI_SRC: ${{ vars.RESUMAKE_UMAMI_SRC }}
          VITE_UMAMI_WEBSITE_ID: ${{ vars.RESUMAKE_UMAMI_WEBSITE_ID }}
          VITE_UMAMI_DOMAINS: resumake.chasestrickler.com
      - name: Upload the site for Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    # Only main deploys, and only after the checks, tests and build above pass.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Let a running deploy finish rather than cancelling it halfway; a newer one queues behind it.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
