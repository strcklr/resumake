# Type-check, test and build the web editor in web/. On main, also deploy it to GitHub Pages.
#
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# If chasestrickler.com is the custom domain of the strcklr.github.io site, this project is then
# served at https://chasestrickler.com/resumake/ with no DNS changes.
name: Web editor

on:
  pull_request:
    paths: ["web/**", "resumes/**", "src/resumake/**", ".github/workflows/web.yml"]
  push:
    branches: [main]
    paths: ["web/**", "resumes/**", "src/resumake/**", ".github/workflows/web.yml"]
  workflow_dispatch: # run by hand on main to redeploy

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Upload the site for Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    # Only main deploys, and only after the checks, tests and build above pass.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Let a running deploy finish rather than cancelling it halfway; a newer one queues behind it.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
