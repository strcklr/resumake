<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>resumake: free resume builder, from YAML to PDF, Word and HTML</title>

      name="description"
      content="Free, open-source resume builder. Write your resume once in YAML and export ATS-friendly PDF, Word, HTML and Markdown in seven themes. Runs in your browser: nothing is uploaded."

    <!-- Link previews (Slack, LinkedIn, X, iMessage): public/og.png is made by scripts/og-image.sh. -->

    <meta property="og:site_name" content="resumake" />
    <meta property="og:url" content="https://resumake.chasestrickler.com/" />

        "name": "resumake",
        "url": "https://resumake.chasestrickler.com/",
        "description": "Free, open-source resume builder: write your resume once in YAML and export PDF, Word, HTML and Markdown in seven ATS-friendly themes.",
